name: Deploy

# Runs after CI passes on main: builds the images, pushes them to GHCR and
# redeploys the control plane host over SSH.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      HOST: ${{ vars.DEPLOY_HOST || '178.104.208.91' }}
      PREFIX: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/trailway-api/Dockerfile
          push: true
          tags: |
            ${{ env.PREFIX }}/trailway-api:latest
            ${{ env.PREFIX }}/trailway-api:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ env.PREFIX }}/trailway-web:latest
            ${{ env.PREFIX }}/trailway-web:${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/id_deploy root@$HOST"
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml "root@$HOST:/opt/trailway/docker-compose.prod.yml"
          $SSH "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          $SSH "cd /opt/trailway && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ steps.tag.outputs.sha }}/' .env && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans && docker image prune -f"
